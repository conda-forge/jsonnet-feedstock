schema_version: 1

context:
  name: jsonnet
  version: "0.22.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: eae5d9bf23c778baad39390f88c13c03b2090dfb5dfa148d6e217df8c1448258

build:
  number: 0
  skip: ppc64le
  script: python -m pip install . -vv --no-build-isolation --no-deps

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - cmake
    - make
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - _jsonnet

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Python bindings for Jsonnet - The data templating language
  homepage: http://github.com/google/jsonnet

extra:
  recipe-maintainers:
    - nelson-liu
    - michamucha
    - synapticarbors
